{% extends base %}

{% block postamble %}
    <!-- Include Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Include custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
{% endblock %}

{% block contents %}
    <!-- Navbar similar to BootstrapTemplate -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4" style="box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">CF Analytics</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Additional navbar items could go here -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container-fluid" style="padding-left: 2rem; padding-right: 2rem;">
        {{ embed(roots.main_tabs) }}
    </div>

    <!-- Floating Chat Icon directly embedded from Panel instead of raw HTML if we pass it, but wait, the inline html was in app.py. We can move it here -->
    <div id="floating-chat-icon" onclick="alert('Chatbot UI will open here!')">
        💬
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
{% endblock %}

{% extends base %}

{% block postamble %}
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<!-- Include Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
<!-- Include custom CSS -->
<link rel="stylesheet" href="assets/css/style.css">
<style>
    .main-content-container {
        padding-left: 2rem;
        padding-right: 2rem;
    }
    @media (max-width: 768px) {
        .main-content-container {
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }
    }
</style>
{% endblock %}

{% block contents %}
<!-- Navbar similar to BootstrapTemplate -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4" style="box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">CF Analytics</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <!-- Additional navbar items could go here -->
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content Area -->
<div class="container-fluid main-content-container">
    {{ embed(roots.main_tabs) }}
</div>

<!-- Floating Chatbot Widget -->
<div id="chatbot-container" class="chatbot-hidden">
    <div class="chatbot-header d-flex justify-content-between align-items-center p-3 text-white bg-primary rounded-top">
        <h5 class="m-0">Kofu-chan Chatbot</h5>
        <button type="button" class="btn-close btn-close-white" onclick="toggleChatbot()"></button>
    </div>
    <div class="chatbot-body p-2 flex-grow-1">
        {{ embed(roots.chatbot) }}
    </div>
</div>

<!-- Floating Chat Icon -->
<div id="floating-chat-icon" onclick="toggleChatbot()">
    💬
</div>

<script>
    function toggleChatbot() {
        const container = document.getElementById('chatbot-container');
        container.classList.toggle('chatbot-visible');
        container.classList.toggle('chatbot-hidden');
    }
</script>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
{% endblock %}
